server {
    listen 80;
    client_max_body_size 250M;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files $uri $uri/ /index.html;
    }

    # Restore accepts a 700,000,000-byte file plus multipart headers. Keep the
    # ordinary API/body limits unchanged and avoid buffering a second disk copy.
    location = /api/system/restore {
        client_max_body_size 700M;
        client_body_timeout 3600s;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_pass http://radius_api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Large stored backup jobs and restores use the same synchronous workflow.
    location ~ "^/api/system/(backup-jobs/[0-9]+/run|local-backups/[0-9a-f]{32}/(restore|download))$" {
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_pass http://radius_api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/ {
        proxy_pass http://radius_api:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /auth/ {
        proxy_pass http://radius_api:3000/auth/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
