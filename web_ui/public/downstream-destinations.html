<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><link rel="icon" type="image/svg+xml" href="/favicon.svg"><title>Downstream RADIUS</title><script src="https://cdn.tailwindcss.com"></script></head><body>
<main hidden>
  <div class="flex items-center justify-between mb-6"><div><h1 class="text-3xl font-bold text-gray-800">Downstream RADIUS</h1><p class="text-sm text-gray-600 mt-1">Destinations belong to the selected tenant. Route NAS clients or profiles to them from their own pages.</p></div><button id="addDestination" type="button" class="bg-blue-600 text-white px-4 py-2 rounded-lg font-bold">+ Add destination</button></div>
  <p id="destinationScope" class="text-sm font-semibold text-gray-700 mb-3" role="status"></p>
  <p id="destinationStatus" class="text-sm mb-4" role="status" aria-live="polite"></p>
  <div class="bg-white p-4 rounded-xl shadow-lg overflow-x-auto"><table class="w-full text-left text-sm"><thead><tr class="bg-gray-50"><th class="p-3">Name</th><th class="p-3">IPv4</th><th class="p-3">Auth port</th><th class="p-3">Accounting port</th><th class="p-3 text-right">Actions</th></tr></thead><tbody id="destinationRows"></tbody></table></div>
</main>
<div id="destinationModal" class="fixed inset-0 bg-black bg-opacity-60 hidden flex items-center justify-center p-4 z-50"><div class="bg-white p-6 rounded-xl max-w-md w-full"><h2 id="destinationTitle" class="text-xl font-bold mb-4">Add destination</h2><form id="destinationForm" class="space-y-4"><input type="hidden" id="destinationId"><label class="block text-sm font-bold">Name<input id="destinationName" required maxlength="100" class="w-full border p-2 rounded-lg" autocomplete="off"></label><label class="block text-sm font-bold">Canonical IPv4 address<input id="destinationIpv4" required inputmode="decimal" placeholder="192.0.2.10" class="w-full border p-2 rounded-lg"></label><label class="block text-sm font-bold">Authentication port<input id="destinationAuthPort" type="number" min="1" max="65535" required value="1812" class="w-full border p-2 rounded-lg"></label><label class="block text-sm font-bold">Accounting port<input id="destinationAcctPort" type="number" min="1" max="65535" required value="1813" class="w-full border p-2 rounded-lg"></label><label class="block text-sm font-bold">Shared secret<input id="destinationSecret" type="password" maxlength="253" autocomplete="new-password" class="w-full border p-2 rounded-lg"><span id="destinationSecretHint" class="block font-normal text-gray-500 mt-1">Required when creating. Never displayed after saving.</span></label><p id="destinationFormStatus" role="alert" class="text-sm"></p><div class="flex justify-end gap-3"><button id="cancelDestination" type="button" class="bg-gray-200 px-4 py-2 rounded-lg font-bold">Cancel</button><button id="saveDestination" type="submit" class="bg-blue-600 text-white px-4 py-2 rounded-lg font-bold">Save and activate</button></div></form></div></div>
<script src="/js/layout.js"></script><script>
let destinations = [];
const $ = id => document.getElementById(id);
function status(message, error = false) { $('destinationStatus').textContent = message; $('destinationStatus').className = error ? 'text-red-700 text-sm mb-4' : 'text-green-700 text-sm mb-4'; }
function selectedScope() { const id = localStorage.getItem('activeTenantId'); if (window.multiTenantEnabled && id !== 'global') return (window.availableTenants || []).find(t => String(t.id) === id)?.name || 'Selected tenant'; return 'Global'; }
async function loadDestinations() {
  try {
    const response = await apiFetch('/api/downstream-destinations');
    if (!response.ok) throw new Error((await response.json()).error || 'Unable to load destinations');
    destinations = await response.json();
    $('destinationScope').textContent = `Scope: ${selectedScope()} — only destinations owned by this scope are shown.`;
    const body = $('destinationRows'); body.replaceChildren();
    if (!destinations.length) { const row = body.insertRow(); const cell = row.insertCell(); cell.colSpan = 5; cell.className = 'p-4 text-gray-500'; cell.textContent = 'No downstream destinations in this scope.'; }
    for (const item of destinations) {
      const row = body.insertRow(); row.className = 'border-b';
      for (const value of [item.name, item.ipv4, item.auth_port, item.accounting_port]) { const cell = row.insertCell(); cell.className = 'p-3'; cell.textContent = value; }
      const actions = row.insertCell(); actions.className = 'p-3 text-right';
      for (const [label, action] of [['Edit', () => openDestination(item.id)], ['Delete', () => deleteDestination(item.id)]]) { const button = document.createElement('button'); button.type = 'button'; button.textContent = label; button.className = label === 'Delete' ? 'text-red-700 px-3 py-1 font-bold' : 'text-blue-700 px-3 py-1 font-bold'; button.onclick = action; actions.appendChild(button); }
    }
  } catch (error) { status(error.message, true); }
}
function openDestination(id = null) {
  const item = destinations.find(d => d.id === id);
  $('destinationForm').reset(); $('destinationId').value = id || '';
  $('destinationName').value = item?.name || ''; $('destinationIpv4').value = item?.ipv4 || '';
  $('destinationAuthPort').value = item?.auth_port || 1812; $('destinationAcctPort').value = item?.accounting_port || 1813;
  $('destinationSecret').value = ''; $('destinationSecret').required = !item;
  $('destinationSecretHint').textContent = item ? 'Leave blank to keep the existing secret; enter a new value to rotate it.' : 'Required when creating. Never displayed after saving.';
  $('destinationTitle').textContent = item ? 'Edit destination' : 'Add destination';
  $('destinationFormStatus').textContent = ''; $('destinationModal').classList.remove('hidden');
}
async function deleteDestination(id) {
  const item = destinations.find(d => d.id === id); if (!item || !confirm(`Delete ${item.name}? NAS/profile routes using it will be removed.`)) return;
  status('Deleting and activating RADIUS…');
  try { const response = await apiFetch(`/api/downstream-destinations/${id}`, {method:'DELETE'}); const result = await response.json(); if (!response.ok || !result.radius_reloaded) throw new Error(result.saved ? 'Deleted, but RADIUS activation failed. Check service status before retrying.' : result.error || 'Activation not confirmed'); await loadDestinations(); status('Destination deleted and RADIUS activated.'); }
  catch (error) { status(error.message, true); }
}
$('destinationForm').onsubmit = async event => {
  event.preventDefault(); const id = $('destinationId').value, secret = $('destinationSecret').value;
  const payload = { name: $('destinationName').value.trim(), ipv4: $('destinationIpv4').value.trim(), auth_port: Number($('destinationAuthPort').value), accounting_port: Number($('destinationAcctPort').value) };
  if (secret) payload.shared_secret = secret;
  $('saveDestination').disabled = true; $('destinationFormStatus').textContent = 'Saving and activating RADIUS…';
  try { const response = await apiFetch(id ? `/api/downstream-destinations/${id}` : '/api/downstream-destinations', { method:id ? 'PUT':'POST', body:JSON.stringify(payload) }); const result = await response.json(); if (!response.ok || !result.radius_reloaded) throw new Error(result.saved ? 'Saved, but RADIUS activation failed. Check service status before retrying.' : result.error || 'Activation not confirmed'); $('destinationSecret').value = ''; $('destinationModal').classList.add('hidden'); await loadDestinations(); status('Destination saved and RADIUS activated.'); }
  catch (error) { $('destinationFormStatus').textContent = error.message; status(error.message, true); }
  finally { $('saveDestination').disabled = false; }
};
$('addDestination').onclick = () => openDestination(); $('cancelDestination').onclick = () => { $('destinationSecret').value = ''; $('destinationModal').classList.add('hidden'); };
let booted = false; function bootstrap() { if (booted || !window.radiusstackContext || !hasPermission(window.currentPermissions, 'nas')) return; booted = true; document.querySelector('main').hidden = false; loadDestinations(); }
document.addEventListener('radiusstack:tenant-context-ready', bootstrap); window.addEventListener('load', bootstrap);
</script><script src="/js/field-help.js"></script></body></html>
