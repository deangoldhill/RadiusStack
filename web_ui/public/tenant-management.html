<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Tenant Management</title><script src="https://cdn.tailwindcss.com"></script></head>
<body><main>
  <div class="flex justify-between items-center mb-6"><div><h1 class="text-3xl font-bold text-gray-800">Tenant Management</h1><p class="text-sm text-gray-500 mt-1">Create and maintain platform tenant boundaries.</p></div><button onclick="openTenantModal()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg font-bold shadow-sm">+ Add tenant</button></div>
  <div class="bg-white rounded-xl shadow-lg border border-gray-100 overflow-x-auto"><table class="w-full text-left text-sm"><thead><tr class="bg-gray-50 text-gray-600"><th class="p-3">Tenant ID</th><th class="p-3">Name</th><th class="p-3">Description</th><th class="p-3 text-right">Actions</th></tr></thead><tbody id="tenants"></tbody></table></div>
</main>
<div id="tenantModal" class="fixed inset-0 bg-black bg-opacity-60 hidden flex items-center justify-center p-4 z-50 backdrop-blur-sm" aria-hidden="true">
  <div class="bg-white p-6 rounded-xl shadow-2xl max-w-lg w-full border border-gray-100"><div class="flex justify-between items-center mb-4"><h2 id="tenantModalTitle" class="text-xl font-bold text-gray-800">Add tenant</h2><button type="button" onclick="closeTenantModal()" class="text-gray-500 hover:text-gray-800 text-2xl leading-none" aria-label="Close">&times;</button></div>
    <form id="tenantForm" class="space-y-4"><input type="hidden" id="tenantId"><div><label class="block text-sm font-bold text-gray-700">Name</label><input id="tenantName" required maxlength="100" class="mt-1 w-full border p-2 rounded-lg bg-gray-50 focus:ring focus:ring-indigo-200 outline-none"></div><div><label class="block text-sm font-bold text-gray-700">Description</label><textarea id="tenantDescription" maxlength="255" rows="3" class="mt-1 w-full border p-2 rounded-lg bg-gray-50 focus:ring focus:ring-indigo-200 outline-none"></textarea></div><div class="flex justify-end gap-3 pt-4 border-t"><button type="button" onclick="closeTenantModal()" class="bg-gray-200 hover:bg-gray-300 text-gray-800 px-4 py-2 rounded-lg font-bold">Cancel</button><button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg font-bold">Save tenant</button></div></form>
  </div>
</div>
<script src="/js/layout.js"></script><script>
let tenants = [];
function esc(value) { return String(value || '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
async function load() { const response = await apiFetch('/api/tenants'); if (!response.ok) return; tenants = await response.json(); document.querySelector('#tenants').innerHTML = tenants.map(t => `<tr class="border-b border-gray-50 hover:bg-gray-50"><td class="p-3 font-mono text-gray-500">#${Number(t.id)}</td><td class="p-3 font-bold text-gray-800">${esc(t.name)}</td><td class="p-3 text-gray-600">${esc(t.description)}</td><td class="p-3 text-right space-x-2"><button class="bg-blue-50 text-blue-700 border border-blue-200 hover:bg-blue-100 px-3 py-1.5 rounded-lg text-xs font-bold" onclick="openTenantModal(${Number(t.id)})">Edit</button><button class="bg-red-50 text-red-700 border border-red-200 hover:bg-red-100 px-3 py-1.5 rounded-lg text-xs font-bold" onclick="del(${Number(t.id)})">Delete</button></td></tr>`).join(''); }
window.openTenantModal = function(id = null) { const form = document.getElementById('tenantForm'); form.reset(); document.getElementById('tenantId').value = ''; document.getElementById('tenantModalTitle').textContent = 'Add tenant'; if (id !== null) { const tenant = tenants.find(t => Number(t.id) === Number(id)); if (!tenant) return; document.getElementById('tenantId').value = tenant.id; document.getElementById('tenantName').value = tenant.name; document.getElementById('tenantDescription').value = tenant.description || ''; document.getElementById('tenantModalTitle').textContent = `Edit tenant #${tenant.id}`; } document.getElementById('tenantModal').classList.remove('hidden'); document.getElementById('tenantModal').setAttribute('aria-hidden', 'false'); document.getElementById('tenantName').focus(); };
window.closeTenantModal = function() { document.getElementById('tenantModal').classList.add('hidden'); document.getElementById('tenantModal').setAttribute('aria-hidden', 'true'); };
document.getElementById('tenantForm').onsubmit = async event => { event.preventDefault(); const id = document.getElementById('tenantId').value; const body = JSON.stringify({ name: document.getElementById('tenantName').value.trim(), description: document.getElementById('tenantDescription').value.trim() }); const response = id ? await apiFetch(`/api/tenants/${id}`, { method: 'PUT', body }) : await apiFetch('/api/tenants', { method: 'POST', body }); if (!response.ok) return alert((await response.json()).error || 'Unable to save tenant'); closeTenantModal(); load(); };
window.del = async function(id) { if (!confirm('Delete this tenant?')) return; const response = await apiFetch('/api/tenants/' + id, {method:'DELETE'}); if (!response.ok) return alert((await response.json()).error || 'Unable to delete tenant'); load(); };
load();
</script></body></html>
