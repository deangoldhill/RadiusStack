<!DOCTYPE html>
<html lang="en"><head><link rel="icon" type="image/svg+xml" href="/favicon.svg"><meta charset="UTF-8"><title>Audit Log</title><script src="https://cdn.tailwindcss.com"></script></head><body>
  <main>
    <h1 class="text-3xl font-bold mb-6">Administrator Audit Log</h1>

    <div class="bg-white p-4 rounded shadow mb-6">
      <h2 class="text-lg font-semibold mb-4">Filter & Search</h2>
      <div class="grid grid-cols-4 gap-4">
        <input type="text" id="searchBox" placeholder="Search (username, action, details)" class="border p-2 rounded">
        <select id="resultFilter" class="border p-2 rounded">
          <option value="">All Results</option>
          <option value="success">Success</option>
          <option value="failed">Failed</option>
          <option value="denied">Denied</option>
        </select>
        <input type="date" id="startDate" class="border p-2 rounded">
        <input type="date" id="endDate" class="border p-2 rounded">
      </div>
      <button onclick="loadAudit()" class="mt-4 bg-blue-600 text-white px-4 py-2 rounded">Apply Filters</button>
    </div>

    <div class="bg-white p-4 rounded shadow overflow-x-auto">
      <table class="w-full text-left text-sm whitespace-nowrap" id="auditTable">
        <thead><tr class="bg-gray-100"><th class="p-2">Timestamp</th><th class="p-2">Tenant</th><th class="p-2">Admin</th><th class="p-2">Origin</th><th class="p-2">Action</th><th class="p-2">Result</th><th class="p-2">Details</th><th class="p-2">IP</th></tr></thead>
        <tbody></tbody>
      </table>
    </div><div id="pagination" class="flex flex-wrap items-center justify-between gap-3 mt-4 text-sm"><span id="pageSummary" class="text-gray-500"></span><div class="flex items-center gap-2"><label>Rows <select id="pageSize" onchange="changePageSize()" class="border rounded p-1"><option>25</option><option>50</option><option>100</option></select></label><button id="prevPage" onclick="changePage(-1)" class="border rounded px-3 py-1">Previous</button><button id="nextPage" onclick="changePage(1)" class="border rounded px-3 py-1">Next</button></div></div>
  </main>
  <script src="/js/layout.js"></script>
  <script>
    let currentPage=1,totalPages=1,totalRecords=0;
    async function loadAudit() { const q=new URLSearchParams({page:currentPage,page_size:document.getElementById('pageSize').value}); for(const [key,id] of [['search','searchBox'],['result','resultFilter'],['start_date','startDate'],['end_date','endDate']]){const v=document.getElementById(id).value;if(v)q.set(key,v);} const res=await apiFetch('/api/audit?'+q); if(!res.ok)return; const payload=await res.json(),data=payload.items;totalPages=payload.totalPages;totalRecords=payload.total; const start=totalRecords?(currentPage-1)*Number(document.getElementById('pageSize').value)+1:0;document.getElementById('pageSummary').textContent=`Showing ${start}-${Math.min(currentPage*Number(document.getElementById('pageSize').value),totalRecords)} of ${totalRecords}`;document.getElementById('prevPage').disabled=currentPage<=1;document.getElementById('nextPage').disabled=currentPage>=totalPages;document.querySelector('#auditTable tbody').innerHTML=data.map(a=>{const badge=a.result==='success'?'bg-green-500':a.result==='failed'?'bg-red-500':'bg-yellow-500';return `<tr><td class="p-2 border-b text-xs">${a.timestamp}</td><td class="p-2 border-b"><span class="px-2 py-1 text-xs rounded bg-indigo-50 text-indigo-700 border border-indigo-100">${a.tenant_name||'Global'}</span></td><td class="p-2 border-b font-bold">${a.admin_username}</td><td class="p-2 border-b">${a.origin}</td><td class="p-2 border-b">${a.action}</td><td class="p-2 border-b"><span class="px-2 py-1 text-xs rounded text-white ${badge}">${a.result}</span></td><td class="p-2 border-b text-xs text-gray-600">${a.details||''}</td><td class="p-2 border-b text-xs">${a.ip_address||''}</td></tr>`;}).join(''); }
    function changePage(delta){const p=currentPage+delta;if(p>=1&&p<=totalPages){currentPage=p;loadAudit();}} function changePageSize(){currentPage=1;loadAudit();} loadAudit();
  </script>
</body></html>
